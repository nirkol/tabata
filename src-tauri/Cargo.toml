[package]
name = "yfit-tabata-timer"
version = "0.1.0"
description = "yFit Tabata Timer"
authors = ["yFit"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.0" }
# Keeps the display (and Mac) awake while a routine runs (IOPMAssertion on macOS).
keepawake = "0.6.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
